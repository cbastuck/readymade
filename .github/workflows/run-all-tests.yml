name: Run Selected CI Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e_failure_probe:
        description: Deliberately fail the cloud artifact probe
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Keep the existing C++/unit lane on main and manual runs.
    if: github.event_name != 'pull_request' && !inputs.e2e_failure_probe
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VCPKG_FEATURE_FLAGS: manifests,binarycaching
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite;files,${{ github.workspace }}/.cache/vcpkg/binary,readwrite
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            hkp-frontend/package-lock.json

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31"

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/vcpkg/binary
            .cache/vcpkg/downloads
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('3rdparty/vcpkg.json', '3rdparty/vcpkg-triplets/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Setup vcpkg
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local attempts="$1"
            shift
            local n=1
            until "$@"; do
              if [[ "${n}" -ge "${attempts}" ]]; then
                return 1
              fi
              n=$((n + 1))
              sleep $((n * 2))
            done
          }

          mkdir -p .cache/vcpkg/binary .cache/vcpkg/downloads

          vcpkg_baseline="bba8b52f6dea74159bba855ef00376e588d6ea0a"
          if [[ ! -f 3rdparty/vcpkg/scripts/buildsystems/vcpkg.cmake ]]; then
            retry 5 git clone https://github.com/microsoft/vcpkg.git 3rdparty/vcpkg
          fi
          retry 5 git -C 3rdparty/vcpkg fetch origin "${vcpkg_baseline}"
          git -C 3rdparty/vcpkg checkout --force "${vcpkg_baseline}"
          retry 3 ./3rdparty/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local attempts="$1"
            shift
            local n=1
            until "$@"; do
              if [[ "${n}" -ge "${attempts}" ]]; then
                return 1
              fi
              n=$((n + 1))
              sleep $((n * 2))
            done
          }

          arch="$(uname -m)"
          if [[ "${arch}" == "arm64" ]]; then
            triplet="arm64-osx-release"
          else
            triplet="x64-osx-release"
          fi

          retry 3 ./3rdparty/vcpkg/vcpkg install \
            --x-manifest-root=3rdparty \
            --triplet="${triplet}"

      - name: Prepare frontend dependencies
        working-directory: hkp-frontend
        run: npm ci

      - name: Run hkp-rt tests
        working-directory: hkp-rt
        run: ./run-tests.sh

      - name: Run hkp-frontend demo boards test
        working-directory: hkp-frontend
        run: npm run test -- src/runtime/browser/tests/demo-boards.regression.test.tsx

      - name: Run hkp-frontend tests (excluding demo boards)
        working-directory: hkp-frontend
        env:
          CI: true
        run: npm run test -- --exclude src/runtime/browser/tests/demo-boards.regression.test.tsx

  e2e:
    name: E2E browser
    if: ${{ !inputs.e2e_failure_probe }}
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            hkp-frontend/package-lock.json
            meander/frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: hkp-frontend
        run: npm ci

      - name: Install Readymade frontend dependencies
        working-directory: meander/frontend
        run: npm ci

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Check E2E summary reporter
        working-directory: e2e
        run: npm run test:reporter

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium webkit

      - name: Run E2E tests
        working-directory: e2e
        run: npm test

      - name: Upload E2E report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-failure-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: warn
          retention-days: 7

  e2e-cloud:
    name: E2E Node cloud
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      HKP_E2E_CLOUD_TARGET: node
      HKP_E2E_FAILURE_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e_failure_probe && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: false

      - name: Checkout pinned Node runtime
        # Only this public GitHub submodule is needed; others include SSH remotes.
        run: |
          git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init -- hkp-node

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            hkp-frontend/package-lock.json
            meander/frontend/package-lock.json
            hkp-node/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: hkp-frontend
        run: npm ci

      - name: Install Readymade frontend dependencies
        working-directory: meander/frontend
        run: npm ci

      - name: Install Node runtime dependencies
        working-directory: hkp-node
        run: npm ci

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install chromium

      - name: Run Node cloud E2E tests
        working-directory: e2e
        run: npm run test:cloud

      - name: Upload cloud diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-node-cloud-failure-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: warn
          retention-days: 7
